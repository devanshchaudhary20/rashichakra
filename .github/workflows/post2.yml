name: Daily Horoscope Carousel (part 2)

on:
  schedule:
    # 03:00 UTC = 30 min after post.yml (02:30 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-v2

      - name: Download fonts
        if: steps.cache-fonts.outputs.cache-hit != 'true'
        run: bash scripts/download_fonts.sh

      - name: Publish carousel (part 2)
        env:
          IG_LONG_LIVED_TOKEN: ${{ secrets.IG_LONG_LIVED_TOKEN }}
          IG_USER_ID:          ${{ secrets.IG_USER_ID }}
          IG_APP_ID:           ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET:       ${{ secrets.IG_APP_SECRET }}
          GITHUB_REPO:         ${{ github.repository }}
          GITHUB_BRANCH:       main
          IG_HANDLE:           ${{ vars.IG_HANDLE }}
        run: python -m src.main publish --part 2

      - name: Commit posted-state log
        run: |
          git config user.name  "rashichakra-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A state/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Log published horoscope [skip ci]"
          git pull --rebase origin main
          git push
